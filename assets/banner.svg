<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" viewBox="0 0 1200 340" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#090d16"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="blurLight" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="60"/></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(30px,-20px);opacity:.6}}@keyframes floatPill1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-1.5deg)}}@keyframes floatPill2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes floatPill3{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-1deg)}}@keyframes gridSweep{0%{stroke-dashoffset:800}}.orb-1{animation:pulseOrb 9s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 11s ease-in-out infinite 3s;transform-origin:950px 220px}.pill-1{animation:floatPill1 5s ease-in-out infinite}.pill-2{animation:floatPill2 6s ease-in-out infinite .7s}.pill-3{animation:floatPill3 5.5s ease-in-out infinite 1.4s